<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css" />
    <style>
        body {
            background-color: black;
	    font-family: "Silkscreen", sans-serif;
            color: white;
        }
	.button1{
	    border: none;
	    padding-left: 10px;
	    margin-top: 50px;
	    background-color: rgba(0, 0, 0, 0);
	}
	a{
	    font-family: "Silkscreen", sans-serif;
            color: white;
	    font-size: 140%;
	    text-decoration: none;
	}
        .box{
            border-style: solid;
            border-color: white;
            border-width: 2px;
            padding-top: 7px;
	    padding-left: 15px;
	    padding-bottom: 5vh;
        }
	.first{
  	    margin: 10px 0 0 10px;
	    white-space: nowrap;
            overflow: hidden;
  	    width: 30em;
  	    animation: type 4s steps(60, end);
        }
	.second{
	    margin: 10px 0 0 10px;
            white-space: nowrap;
            overflow: hidden;
            width: 50em;
            animation: type 4s steps(60, end) 4s backwards;
        }
	#third{
	}
	#fourth{
	    margin-left: 50px;
	}
	@keyframes type{
  	    from { width: 0; }
	}
	.container{
	    position: fixed;
	    width: 99vw;
            bottom: 0;
	}
    </style>
</head>

<body>
    <div class="container">
    	<img class="img" style="position: relative" src="/static/choose_cat.png" alt="cute cat">
    </div>
    <div class="box">
        <p class="first" style="font-size:120%">Login or register to continue!</p>
	<p class="second" style="font-size:120%">(no, you don't get to play as a guest. deal with it.)</p>
        <button class="button1" id = "third"> <a href = "login"> login </a> </button>
    	<button class="button1" id = "fourth"> <a href = "signup"> register </a> </button>
    </div>
</body>
<script>
    document.getElementById("third").style.visibility = "hidden";
    document.getElementById("fourth").style.visibility = "hidden";

    function show(){
        document.getElementById("third").style.visibility = "visible";
	document.getElementById("fourth").style.visibility = "visible";
    }
    setTimeout(show, 8000)
</script>

</html>
