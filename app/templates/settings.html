<html>
   <head>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <title>User Account Information</title>
      <style>
         body{
         background-color: black;
         color: #3d251d;
         font-family: "Silkscreen", sans-serif;
         background-repeat: no-repeat;
         background-size: 100vw 100vh;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-bottom: 2vh;
         padding-left: 2vw;
         padding-right: 2vw;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
      </style>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{url_for('encounters')}}">Encounters</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
      </nav>
      <div class="hold">
         <h1>User Account Information</h1>
         <br>
         <p>Username: {{username}}</p>
         <div class="sign3">Change password:</div>
         <br>
         <div class="forms">
            <form action="/settings" method="POST">
               <input class="a" type="password" placeholder="old password" name="old_pass" required>
               <br>
               <br><input class="a" type="password" placeholder="new password" name="new_pass" required>
               <br>
               <br><input class="b" type="submit" name="password_form" value="Submit">
               <br>
            </form>
            <br>
            <p style="font-size: 110%; color: white;">{{ error }}</p>
         </div>
         <br>
         <button class="b" onclick="location.href='/encounters'">Back to Cats</button>
      </div>
   </body>
</html>
