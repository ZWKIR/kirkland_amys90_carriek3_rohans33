<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title> LOGIN PAGE </title>
    <style>
        body{
	    background-image: url("/static/startscreen.png");
	    color: #3d251d;
	    font-family: "Silkscreen", sans-serif;
	    background-repeat: no-repeat;
	    background-size: cover;
	}
	.hold{
            text-align: center;
	    margin-left: 10vw;
            margin-right: 10vw;
	}
    </style>
  </head>
  <body>
     <div class="hold">
     <h1>
        Login
     </h1>
     <form action="/login" method="POST">
        <h2>Username:</h2> <input class="a" type="text" name="username" required>
        <br>
        <h2>Password:</h2> <input class="a" type=password name="password" required>
        <br>
        <br>
        <input type="submit" name="sub1" value="Login">
     </form>
    <h5> {{invalid}} </h5>
    <br>
    <div>
    <p style="font-size: 110%"> If you don't have an account, click the button below to register. </p>
    <a href="{{url_for('signup')}}"> <button class="b">Register</button> </a>
    </div>
    </div>
  </body>
</html>
