<html>
   <head>
      <title> Profile </title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-repeat: no-repeat;
         background-size: 100vw 100vh;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-bottom: 2vh;
         padding-left: 2vw;
         padding-right: 2vw;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
      </style>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('settings') }}">Settings</a> </button>
         <button class="c"> <a class="d" href="{{url_for('encounters')}}">Encounters</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
      </nav>
      <div class= "text-center">
         <h2>User Information: {{username}}</h2>
         <img src= "{{ icon }}" class= "img-fluid" alt= "profilepic" style="width:150px; height:150px; object-fit:cover;">
      </div>
      <details class = "profile-select" style="padding:10px;">
         <summary class="button">Change Profile Picture</summary>
         <div class = "profile-icons">
            {% for icon in profile_icons %}
            <form action = "/profile" method = "POST">
               <input type = "hidden" name = "profile_icon" value = "{{ icon }}">
               <button type = "submit" class = "icon-button">
               <img src = "{{ icon }}" class = "profile-icon" alt = "Profile Icon {{ loop.index }}" style="width:150px; height:150px; object-fit:cover;">
               </button>
            </form>
            {% endfor %}
         </div>
      </details>
      <div class="container">
        <div class="row">
      {% for row in infoRow %}
      <div class="col">
      <ul>
        <li>Cat: {{ row[0] }}</li>
        <li>Affection: {{ row[1] }}</li>
        <li>Level: {{ row[2] }}</li>
      </ul>
    </div>
      {% endfor %}
    </div>
     </div>
   </body>
</html>
