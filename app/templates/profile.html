<html>
  <head>
    <title> Profile </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <nav>
      <a href="{{ url_for('start') }}">Start</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>

    <div class= "text-center">
      <h2>User Information: {{username}}</h2>
      <img src= "{{ icon }}" class= "img-fluid" alt= "profilepic" style="width:150px; height:150px; object-fit:cover;">
    </div>

    <details class = "profile-select" style="padding:10px;">
        <summary class="button">Change Profile Picture</summary>
          <div class = "profile-icons">
            {% for icon in profile_icons %}
            <form action = "/profile" method = "POST">
              <input type = "hidden" name = "profile_icon" value = "{{ icon }}">
              <button type = "submit" class = "icon-button">
                <img src = "{{ icon }}" class = "profile-icon" alt = "Profile Icon {{ loop.index }}" style="width:150px; height:150px; object-fit:cover;">
              </button>
            </form>
            {% endfor %}
          </div>
    </details>

  </body>

</html>
