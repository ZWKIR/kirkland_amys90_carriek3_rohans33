<html>
   <head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-image: url("{{ url }}");
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         background-attachment: fixed;
         }
         html, body {
         height: 100%;
         padding: 0;
         margin: 0;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%;
         }
         .a{
         color: white;
         font-family: "Silkscreen", sans-serif;
         }
         .b, p{
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: white;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: white;
         }
         nav{
         padding-left: 2vw;
         padding-right: 2vw;
         padding-top: 0.5vw;
         padding-bottom: 0.5vw;
         border: none;
         border-radius: 6px;
         color: white;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-bottom: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: white;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
         h2 {
         padding-bottom: 2vh;
         padding-left: 2.3vw;
         visibility: hidden;
         }
         .w{
         background-color: rgba(255, 255, 255, 0.3);
         margin-top: 0.7vh;
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         border-radius: 30px;
         display: inline;
         font-size: 92%;
         position: fixed;
         right: 14px;
         padding-right: 5vh;
         padding-left: 5vh;
         }
      </style>
      <title> You encountered a cat! </title>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{url_for('settings')}}">Settings</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
         <div class="w">
            <!-- icons credit to https://www.amcharts.com/free-animated-svg-weather-icons/ -->
            Weather set to {{city}} - {{weather}} <img src="/static/animated/{{ weather }}.svg" alt="icon"> {{ temperature }}˚F
         </div>
      </nav>
      <h2>
         You encountered a cat!
      </h2>
      {% block content %} {% endblock %}
      {% if alert %}
      <div class="alert alert-success alert-dismissible fade show w-25 ms-4" role="alert">
         <strong>{{ alert["cat"] }}</strong><br> Affection +{{alert["addedAffec"]}}<br>
         {% if alert["levelUp"] %}
         <br><strong>Level Up!</strong>
         {% endif %}
         <br>Level: {{alert["level"]}}
         <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endif %}
   </body>
</html>
