<html>
   <head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-image: url("{{ url }}");
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         background-attachment: fixed;
         }
         html, body {
         height: 100%;
         padding: 0;
         margin: 0;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b, p{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-bottom: 2vh;
         padding-left: 2vw;
         padding-right: 2vw;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
      </style>
      <title> You encountered a cat! </title>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
         <button class="c"> <a class="d" href="{{url_for('encounters')}}">Encounters</a> </button>
      </nav>
      <h2>
         You encountered a cat!
      </h2>
      <p>Weather set to {{city}}</p>
      {% block content %} {% endblock %}
   </body>
</html>
