<html>
   <head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <title> You encountered a cat! </title>
      <style>
         html, body {
            height: 100%;
            padding: 0;
            margin: 0;
         }
         body {
            background-image: url("{{ url }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
         }
         p {
            color: white;
         }
      </style>
   </head>
   <body>
      <nav>
         <a href="{{ url_for('start') }}">Start</a>
         <a href="{{ url_for('profile') }}">Profile</a>
         <a href="{{ url_for('settings') }}">Settings</a>
         <a href="{{ url_for('logout') }}">Logout</a>
      </nav>
      <h2>
         You encountered a cat!
      </h2>
      <p>Weather set to {{city}}</p>
      <div class="container text-center">
         <div class="row justify-content-start">
            <div class="col-4">
               <button type="image-button" class="btn btn-secondary"><img src="/static/cattttt.png" alt="pixelcat"></button>
            </div>
         </div>
         <div class="row justify-content-around">
            <div class="col-4">
               <button type="image-button" class="btn btn-secondary"><img src="/static/cattttt.png" alt="pixelcat"></button>
            </div>
         </div>
         <div class="row justify-content-between">
            <div class="col-4">
               <button type="image-button" class="btn btn-secondary"><img src="/static/cattttt.png" alt="pixelcat"></button>
            </div>
         </div>
      </div>
   </body>
