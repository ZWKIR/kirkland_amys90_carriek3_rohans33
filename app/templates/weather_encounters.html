<html>
   <head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <title> Weather Encounter </title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
       <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-image: url("/static/house.png");
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         background-attachment: fixed;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         h2{
         padding-bottom: 2vh;
         padding-left: 2.3vw;
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-left: 2vw;
         padding-right: 2vw;
         padding-top: 0.5vw;
         padding-bottom: 0.5vw;
         border: none;
         border-radius: 6px;
         color: white;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-bottom: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
         .button1{
         border: none;
         padding-left: 10px;
         background-color: rgba(0, 0, 0, 0);
         }
         .box{
         border-style: solid;
         border-color: white;
         border-width: 2px;
         padding-top: 7px;
         padding-left: 15px;
         padding-bottom: 5vh;
         width: 99vw;
             background: black;
         }
         p{
         margin: 10px 0 0 10px;
         font-size: 120%;
         }
         #first{
         }
         .container{
         position: fixed;
         width: 100%;
         bottom: 0;
         background: black;
         }
         #play{
         margin-left: 90vw;
         }
         #hold{
         margin-left: 90vw;
         }
         #continue{
         margin-left: 90vw;
         }
      </style>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{url_for('encounters')}}">Encounters</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
      </nav>
      <h2>
         You encountered a cat!
      </h2>
      <img height="500" src="/static/cats/{{ currCat[0] }}.png" style="transform: rotateY(180deg);" alt="cat">
      <div class="container">
         <div class="box">
            <p> &lt; {{ breed }} &gt;</p>
            <p id="first"><br></p>
	    <br>
	    <br>
	    <br>
	    <div style="margin: 10px;">
            <button onclick="response1()" id = "second">
                {% if currCat[4] == 0 %}
                    {{ dialogue[0] }}
                {% else %}
                    {% set n = dialogue[0] | int %}
                    {{currTrivia[n + 1]}}
                {% endif %}
            </button>
            <button onclick="response2()" id = "third">
                {% if currCat[4] == 0 %}
                    {{ dialogue[1] }}
                {% else %}
                    {% set n = dialogue[1] | int %}
                    {{currTrivia[n + 1]}}
                {% endif %}
            </button>
            <button onclick="response3()" id = "fourth">
                {% if currCat[4] == 0 %}
                    {{ dialogue[2] }}
                {% else %}
                    {% set n = dialogue[2] | int %}
                    {{currTrivia[n + 1]}}
                {% endif %}
            </button>
            <button onclick="response4()" id = "fifth">
                {% if currCat[4] == 0 %}
                    {{ dialogue[3] }}
                {% else %}
                    {% set n = dialogue[3] | int %}
                    {{currTrivia[n + 1]}}
                {% endif %}
            </button>
	    </div>
            <button class="button1" id="play"> <img class="img" src="/static/play.png" alt="play"> </button>
            <button class="button1" id="hold" style="display: none;"> <img class="img" src="/static/play.png" alt="hold"> </button>
            <a href="/encounters"> <button class="button1" id="continue" style="display: none;"> <img class="img" src="/static/play.png" alt="continue"> </button> </a>
        </div>
      </div>
   </body>
   <script>
      document.addEventListener("DOMContentLoaded", function () {
          let letter = 0;
          let r = "";
          /* currently tuples, need to fix symbols */
          const joke = "{{ currJoke }}";
          const trivia = "{{ currTrivia[1] }}";
          const text = "Affection +{{ addedAffec }} Level: {{ lvl }}";
          document.getElementById("second").style.visibility = "hidden";
          document.getElementById("third").style.visibility = "hidden";
          document.getElementById("fourth").style.visibility = "hidden";
          document.getElementById("fifth").style.visibility = "hidden";
          function show(){
              document.getElementById("third").style.visibility = "visible";
              document.getElementById("second").style.visibility = "visible";
              document.getElementById("fourth").style.visibility = "visible";
              document.getElementById("fifth").style.visibility = "visible";
          }
          function go(){
	      document.getElementById("hold").style.display = "none";
	      document.getElementById("continue").style.display = "inline";
          }
          function clear(){
              letter = 0;
          }
          function uh(){
              document.getElementById("first").innerHTML = "";
          }
          function typeDialogue() {
              if ({{ currCat[4] }} == 0){
                if (letter < joke.length) {
                  if (!("(,)&#394;".includes(joke.charAt(letter)))) {
                    document.getElementById("first").innerHTML += joke.charAt(letter);
                  }
                    letter++;
                    let speed = 25;
                    setTimeout(typeDialogue, speed);
                }
              }
              if ({{ currCat[4] }} == 1){
                if (letter < trivia.length) {
                  if (!("(,)&#394;".includes(trivia.charAt(letter)))) {
                    document.getElementById("first").innerHTML += trivia.charAt(letter);
                  }
                    letter++;
                    let speed = 25;
                    setTimeout(typeDialogue, speed);
                }
              }
          }
          function typeText() {
              if (letter < text.length) {
                  document.getElementById("first").innerHTML += text.charAt(letter);
                  letter++;
                  let speed = 25;
                  setTimeout(typeText, speed);
              }
          }
          function process(a){
              if ({{ currCat[4] }} == 0){
                  if({{currCat[1]}} == 5 && a === "Hilarious"){
		      r = "OMG you liked it! That was one of my favorite jokes! Let's be friends :)";
		  }
                  else if(({{currCat[1]}} == 4 || {{currCat[1]}} == 3) && a === "That's a great joke!"){
		      r = "Right? If I see you again, I'll tell you another.";
		  }
                  else if({{currCat[1]}} == 2 && a === "Meh."){
		      r = "Yeah, I thought it was meh too. Maybe I'll do better next time.";
		  }
                  else if({{currCat[1]}} == 1 && a === "I've heard better..."){
		      r = "I know... I wish I was better at jokes...";
		  }
		  else{
		      r = "...";
                  }
              }
              if ({{ currCat[4] }} == 1){
                  if(a === "{{currTrivia[6]}}"){
	              if({{currCat[2]}} == 5){
		          r = "Wow! You got it right! That's amazing :)";
                      }
	              else if({{currCat[2]}} == 4){
		          r = "Correct! Good job.";
                      }
	              else if({{currCat[2]}} == 3){
		          r = "Nice, you got it right.";
                      }
	              else if({{currCat[2]}} == 2){
		          r = "That was unexpected. You're correct.";
                      }
	              else if({{currCat[1]}} == 1){
		          r = "Oh... I didn't think you'd get it right, but here we are.";
                      }
                  }
                  else{
                      if({{currCat[2]}} == 5){
		          r = "Aww, you got it wrong :( You'll get it right next time though! I'm sure of it!";
                      }
	              else if({{currCat[2]}} == 4){
		          r = "It's wrong... Next time I see you, I hope you get it right.";
                      }
	              else if({{currCat[2]}} == 3){
		          r = "Oh, it's wrong. Maybe the next time you'll be right.";
                      }
	              else if({{currCat[2]}} == 2){
		          r = "That's kind of unfortunate, you're wrong.";
                      }
	              else if({{currCat[2]}} == 1){
		          r = "Wrong. I expected better of you. I thought you'd get it right. Didn't think you were this stupid...";
                      }
                  }
              }
	  }
          let t = 0;
          let t2 = 0;
          if ({{ currCat[4] }} == 0){
              t = joke.length
          }
          if ({{ currCat[4] }} == 1){
              t = trivia.length
          }
          t2 = 25 * t + 500;
          function response() {
              if (letter < r.length) {
                  document.getElementById("first").innerHTML += r.charAt(letter);
                  letter++;
                  let speed = 25;
                  setTimeout(response, speed);
              }
          }
	  t3 = 25 * r.length + 500;
          document.getElementById("play").onclick = function() {this.style.display = 'none'; document.getElementById("hold").style.display = 'inline'; uh(); typeDialogue(); setTimeout(show, t2);};
	  document.getElementById("second").onclick = function() {this.style.display = 'none'; document.getElementById("third").style.display = 'none'; document.getElementById("fourth").style.display = 'none'; document.getElementById("fifth").style.display = 'none'; uh(); clear(); process(this.textContent.trim()); response(); setTimeout(go, t3);};
	  document.getElementById("third").onclick = function() {this.style.display = 'none'; document.getElementById("second").style.display = 'none'; document.getElementById("fourth").style.display = 'none'; document.getElementById("fifth").style.display = 'none'; uh(); clear(); process(this.textContent.trim()); response(); setTimeout(go, t3);};
	  document.getElementById("fourth").onclick = function() {this.style.display = 'none'; document.getElementById("third").style.display = 'none'; document.getElementById("second").style.display = 'none'; document.getElementById("fifth").style.display = 'none'; uh(); clear(); process(this.textContent.trim()); response(); setTimeout(go, t3);};
	  document.getElementById("fifth").onclick = function() {this.style.display = 'none'; document.getElementById("third").style.display = 'none'; document.getElementById("fourth").style.display = 'none'; document.getElementById("second").style.display = 'none'; uh(); clear(); process(this.textContent.trim()); response(); setTimeout(go, t3);};
      });
   </script>
</html>
