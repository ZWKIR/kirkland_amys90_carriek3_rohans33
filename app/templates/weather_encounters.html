<html>
   <head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <title> Weather Encounter </title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-repeat: no-repeat;
         background-size: 100vw 100vh;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         h2{
         padding-bottom: 2vh;
         padding-left: 2.3vw;
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-left: 2vw;
         padding-right: 2vw;
         padding-top: 0.5vw;
         padding-bottom: 0.5vw;
         border: none;
         border-radius: 6px;
         color: white;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-bottom: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
         .button1{
         border: none;
         padding-left: 10px;
         margin-top: 50px;
         background-color: rgba(0, 0, 0, 0);
         }
         .box{
         border-style: solid;
         border-color: white;
         border-width: 2px;
         padding-top: 7px;
         padding-left: 15px;
         padding-bottom: 5vh;
         width: 99vw;
         }
         p{
         margin: 10px 0 0 10px;
         font-size: 120%;
         }
         #first{
         }
         .container{
         position: fixed;
         width: 100%;
         bottom: 0;
         }
         #play{
         margin-left: 90vw;
         }
         #continue{
         margin-left: 90vw;
         }
      </style>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('start') }}">Start</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{url_for('encounters')}}">Encounters</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
      </nav>
      <h2>
         Weather encounter!
      </h2>
      <div class="container">
         <div class="box">
            <p> &lt; {{ breed }} &gt;</p>
            <p id="first"><br></p>
            <button class="button1" id="play"> <img class="img" src="/static/play.png" alt="play"> </button>
            <a href="/encounters"> <button class="button1" id="continue" style="display: none;"> <img class="img" src="/static/play.png" alt="continue"> </button> </a>
            <button onclick="response1()" id = "second"> {{ dialogue[0] }} </button>
            <button onclick="response2()" id = "third"> {{ dialogue[1] }} </button>
            <button onclick="response3()" id = "fourth"> {{ dialogue[2] }} </button>
            <button onclick="response4()" id = "fifth"> {{ dialogue[3] }} </button>
        </div>
      </div>
   </body>
   <script>
      document.addEventListener("DOMContentLoaded", function () {
          let letter = 0;
          /* currently tuples, need to fix symbols */
          const joke = "{{ currJoke }}";
          const trivia = "{{ currTrivia }}";
          const text = "Affection +{{ addedAffec }} Level: {{ lvl }}";
          document.getElementById("second").style.visibility = "hidden";
          document.getElementById("third").style.visibility = "hidden";
          document.getElementById("fourth").style.visibility = "hidden";
          document.getElementById("fifth").style.visibility = "hidden";
          function show(){
              document.getElementById("third").style.visibility = "visible";
              document.getElementById("second").style.visibility = "visible";
              document.getElementById("fourth").style.visibility = "visible";
              document.getElementById("fifth").style.visibility = "visible";
          }
          function uh(){
              document.getElementById("first").innerHTML = "";
          }
          function typeDialogue() {
              if ({{ currCat[4] }} == 0){
                if (letter < joke.length) {
                  if (!("(,)&#394;".includes(joke.charAt(letter)))) {
                    document.getElementById("first").innerHTML += joke.charAt(letter);
                  }
                    letter++;
                    let speed = 25;
                    setTimeout(typeDialogue, speed);
                }
              }
              if ({{ currCat[4] }} == 1){
                if (letter < trivia.length) {
                  if (!("(,)&#394;".includes(trivia.charAt(letter)))) {
                    document.getElementById("first").innerHTML += trivia.charAt(letter);
                  }
                    letter++;
                    let speed = 25;
                    setTimeout(typeDialogue, speed);
                }
              }
          }
          function typeText() {
              if (letter < text.length) {
                  document.getElementById("first").innerHTML += text.charAt(letter);
                  letter++;
                  let speed = 25;
                  setTimeout(typeText, speed);
              }
          }
          let t = 0;
          let t2 = 0;
          if ({{ currCat[4] }} == 0){
              t = joke.length
          }
          if ({{ currCat[4] }} == 1){
              t = trivia.length
          }
          t2 = 25 * t + 500;
          document.getElementById("play").onclick = function() {this.style.display = 'none'; document.getElementById("continue").style.display = 'inline'; uh(); typeDialogue(); setTimeout(show, t2);};

          function response1() {
            /* happiest response */
            document.getElementById("play").onclick = function() {this.style.display = 'none'; document.getElementById("continue").style.display = 'inline'; uh(); typeText(); setTimeout(show, 7000);};
          }
          function response2() {
            /* 2nd happiest response */
          }
          function response3() {
            /* 2nd negative response */
          }
          function response4() {
            /* most negative response */
          }
      });
   </script>
</html>
