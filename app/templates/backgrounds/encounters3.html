{% extends "encounters_template.html" %}
{% block content %}
      <div class="container text-center">
         <div class="row justify-content-start">
            <div class="col-4">
              <form action="{{ url_for('weatherencounters', weather=weather, random=random) }}" method="GET">
                <button type="submit" class="btn btn-secondary" style="background-color: transparent; border: none; outline: none;">
                  <img src="/static/cattttt.png" alt="pixelcat">
                </button>
              </form>
            </div>
         </div>
         <div class="row justify-content-around">
            <div class="col-4">
              <form action="{{ url_for('weatherencounters', weather=weather, random=random) }}" method="GET">
                <button type="submit" class="btn btn-secondary" style="background-color: transparent; border: none; outline: none;">
                  <img src="/static/cattttt.png" alt="pixelcat">
                </button>
              </form>
            </div>
         </div>
         <div class="row justify-content-end">
            <div class="col-4">
              <form action="{{ url_for('weatherencounters', weather=weather, random=random) }}" method="GET">
                <button type="submit" class="btn btn-secondary" style="background-color: transparent; border: none; outline: none;">
                  <img src="/static/cattttt.png" alt="pixelcat">
                </button>
              </form>
            </div>
         </div>
      </div>
{% endblock %}
